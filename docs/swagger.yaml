info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a server for a Go Drunk Backend API, demonstrating DDD principles.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Drunk Backend API by DDD
  version: "1.0"
paths:
  /analytics/conversations/me:
    get:
      description: Get messaging performance metrics for the current agent
      parameters:
      - description: From Date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To Date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CONVERDA_internal_messaging_controller_dto.AgentStatsResponse'
      security:
      - BearerAuth: []
      summary: Get My Analytics
      tags:
      - Analytics
  /analytics/conversations/team:
    get:
      description: Get messaging performance metrics for the team
      parameters:
      - description: From Date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To Date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CONVERDA_internal_messaging_controller_dto.TeamStatsResponse'
      security:
      - BearerAuth: []
      summary: Get Team Analytics
      tags:
      - Analytics
  /api-keys/{key_id}/revoke:
    post:
      parameters:
      - description: Key ID
        in: path
        name: key_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke API Key
      tags:
      - Apps
  /apps/{app_id}:
    delete:
      description: Delete an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete app
      tags:
      - Apps
    get:
      description: Get details of a specific app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.AppResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get app
      tags:
      - Apps
    put:
      consumes:
      - application/json
      description: Update an existing app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.UpdateAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.AppResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update app
      tags:
      - Apps
  /apps/{app_id}/environments:
    get:
      description: List all environments for an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.EnvironmentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List environments
      tags:
      - Apps
    post:
      consumes:
      - application/json
      description: Create a new environment for an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Environment data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.CreateEnvironmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.EnvironmentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create environment
      tags:
      - Apps
  /apps/{app_id}/metrics:
    get:
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Days to look back
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Get App usage metrics
      tags:
      - Apps
  /apps/{app_id}/providers:
    get:
      description: List all providers for an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.ProviderResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List providers
      tags:
      - Providers
    post:
      consumes:
      - application/json
      description: Create a new provider for an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Tenant ID
        in: query
        name: tenant_id
        required: true
        type: string
      - description: Provider data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.CreateProviderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.ProviderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a provider
      tags:
      - Providers
  /apps/{app_id}/webhooks:
    get:
      description: List all webhooks for an app
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CONVERDA_internal_apps_controller_dto.WebhookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List webhooks
      tags:
      - Webhooks
